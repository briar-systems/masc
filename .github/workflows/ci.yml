name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to build on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
      profile:
        description: build profile
        type: string
        default: debug
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # bumped on purpose, in a PR of its own. mach's bootstrap chain at this commit names the seed
  # and the steps that build it
  MACH_REF: 9a851eba741b28e07a02d6b14a517a0bbce5c8b2
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  # until a 7.x release exists, masc is built with the compiler of the MACH_REF commit of mach,
  # bootstrapped on linux and cross-compiled for each requested runner
  compiler:
    name: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - id: plan
        env:
          RUNNERS: ${{ inputs.runners || '["ubuntu-latest"]' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          mapping = {
              "ubuntu-latest": "linux-x86_64",
              "ubuntu-24.04-arm": "linux-aarch64",
              "windows-latest": "windows-x86_64",
              "windows-11-arm": "windows-aarch64",
              "macos-15": "darwin-aarch64",
              "macos-15-intel": "darwin-x86_64",
          }
          runners = json.loads(os.environ["RUNNERS"])
          targets = []
          for r in runners:
              if r not in mapping:
                  raise SystemExit(f"unknown runner {r}")
              t = mapping[r]
              if t not in targets:
                  targets.append(t)
          need_cross = any(t != "linux-x86_64" for t in targets)
          print("targets=" + ",".join(targets))
          print("need_cross=" + ("true" if need_cross else "false"))
          PY
      - name: restore host mach
        id: mach
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mach-host
          key: mach-host-linux-x86_64-${{ env.MACH_REF }}
      - id: src
        if: steps.mach.outputs.cache-hit != 'true' || steps.plan.outputs.need_cross == 'true'
        env:
          MACH_REF: ${{ env.MACH_REF }}
        run: |
          src=$RUNNER_TEMP/mach-src
          rm -rf "$src"
          git init --quiet "$src"
          git -C "$src" remote add origin https://github.com/briar-systems/mach
          git -C "$src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$src" checkout --quiet FETCH_HEAD
          chain=$(sha256sum < "$src/.github/bootstrap-chain" | awk '{print $1}')
          echo "chain=$chain" >> "$GITHUB_OUTPUT"
      - id: chain
        if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
          restore-keys: |
            chain-${{ runner.os }}-${{ runner.arch }}-
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          (cd "$RUNNER_TEMP/mach-src" && GITHUB_ENV="$RUNNER_TEMP/mach.env" bash .github/scripts/bootstrap.sh --profile release)
          mkdir -p "$RUNNER_TEMP/mach-host"
          cp "$(sed -n 's/^MACH=//p' "$RUNNER_TEMP/mach.env" | tail -n 1)" "$RUNNER_TEMP/mach-host/mach"
      - if: steps.mach.outputs.cache-hit != 'true' && steps.chain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
      - if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mach-host
          key: mach-host-linux-x86_64-${{ env.MACH_REF }}
      - name: cross-compile requested target compilers
        env:
          TARGETS: ${{ steps.plan.outputs.targets }}
          NEED_CROSS: ${{ steps.plan.outputs.need_cross }}
        run: |
          host="$RUNNER_TEMP/mach-host/mach"
          chmod +x "$host"
          out="$RUNNER_TEMP/mach-out"
          rm -rf "$out"
          if [ "$NEED_CROSS" = true ]; then
            (cd "$RUNNER_TEMP/mach-src" && "$host" dep pull .)
          fi
          IFS=, read -r -a targets <<< "$TARGETS"
          for t in "${targets[@]}"; do
            [ -n "$t" ] || continue
            exe=
            case "$t" in windows-*) exe=.exe ;; esac
            mkdir -p "$out/$t"
            if [ "$t" = linux-x86_64 ]; then
              cp "$host" "$out/$t/mach"
            else
              (cd "$RUNNER_TEMP/mach-src" && "$host" build . --profile release -t "$t" -o "cross-$t$exe" && mv "cross-$t$exe" "$out/$t/mach$exe")
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mach-compilers
          path: ${{ runner.temp }}/mach-out
          retention-days: 1
          if-no-files-found: error

  build:
    name: build (${{ matrix.runner }})
    needs: [compiler]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-compilers
          path: ${{ runner.temp }}/mach-compilers
      - name: put mach on PATH
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) t=linux-x86_64 ;;
            Linux-ARM64) t=linux-aarch64 ;;
            Windows-X64) t=windows-x86_64 ;;
            Windows-ARM64) t=windows-aarch64 ;;
            macOS-ARM64) t=darwin-aarch64 ;;
            macOS-X64) t=darwin-x86_64 ;;
            *) echo "::error::unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          root="$RUNNER_TEMP/mach-compilers"
          [ "$RUNNER_OS" = Windows ] && root=$(cygpath -u "$root")
          dir="$root/$t"
          [ "$RUNNER_OS" != Windows ] && chmod +x "$dir/mach"
          echo "$RUNNER_TEMP/mach-compilers/$t" >> "$GITHUB_PATH"
          "$dir/mach" --version
      - run: mach dep pull .
      # masc chooses only mink. every lower pin is mink's own, and gen pins what masc pins
      - name: pins agree with mink's
        run: |
          upper=mink
          pin() { git ${2:+-C "$2"} ls-tree HEAD "$1" | awk '{print $3}'; }
          fail=0
          for path in $(git ls-tree --name-only HEAD dep/); do
            x=${path#dep/}
            own=$(pin "dep/$x")
            if [ "$x" != "$upper" ]; then
              theirs=$(pin "dep/$x" "dep/$upper")
              if [ -n "$theirs" ] && [ "$own" != "$theirs" ]; then
                echo "dep/$x is $own, $upper pins $theirs" >&2; fail=1
              fi
            fi
            gen=$(pin "gen/dep/$x")
            if [ "$gen" != "$own" ]; then
              echo "gen/dep/$x is ${gen:-missing}, dep/$x is $own" >&2; fail=1
            fi
          done
          exit $fail
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - if: strategy.job-index == 0
        run: mach fmt --check gen
      - run: mach build . --all -p "$PROFILE"
      - run: mach dep pull gen
      - run: mach build gen --all -p "$PROFILE"

  gate:
    if: always()
    needs: [compiler, build]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
