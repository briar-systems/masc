name: CI

# every pull request builds and tests each [target.*] in mach.toml, one leg per target,
# on the runner that can run it. a dispatch can name other runners to test a change on
# windows or darwin before it merges.

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
  workflow_call:
    inputs:
      runners:
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_VERSION: 6.10.1
  # bumped on purpose, in a `chore: build with mach <short sha>` PR
  MACH_REF: ac39ae9f12a6075605ef2670f1638d8418c87839

jobs:
  # the [target.*] names in mach.toml, as the JSON array the test matrix reads
  targets:
    name: targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          names=$(sed -n 's/^\[target\.\([^].]*\)\][[:space:]]*$/\1/p' mach.toml)
          if [ -z "$names" ]; then echo "mach.toml has no [target.*]" >&2; exit 1; fi
          list=$(printf '%s\n' "$names" | sed 's/.*/"&"/' | paste -sd, -)
          echo "list=[$list]" >> "$GITHUB_OUTPUT"

  # each leg builds and tests one target, and tests it only where the runner can run it
  test:
    name: test (${{ matrix.runner }}, ${{ matrix.target }})
    needs: [targets]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # until a 7.x release exists, masc is built with the compiler built from
      # the MACH_REF commit of mach, since the released seed cannot read its
      # manifest keys. the built compiler is cached per runner os and arch, seed and MACH_REF
      - id: mach
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_VERSION }}-${{ env.MACH_REF }}
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/seed"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          exe=
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
            exe=.exe
          else
            curl -fsSL "$url/install.sh" | sh
          fi
          git init --quiet "$RUNNER_TEMP/mach-src"
          git -C "$RUNNER_TEMP/mach-src" remote add origin https://github.com/briar-systems/mach
          git -C "$RUNNER_TEMP/mach-src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$RUNNER_TEMP/mach-src" checkout --quiet FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/mach"
          (cd "$RUNNER_TEMP/mach-src" && bash .github/scripts/seed-build.sh "$MACH_INSTALL_DIR/mach$exe" "$RUNNER_TEMP/mach/mach$exe")
      - name: put mach on PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      # masc chooses only mink. every lower pin is mink's own, and gen pins what masc pins
      - if: strategy.job-index == 0
        name: pins agree with mink's
        run: |
          upper=mink
          pin() { git ${2:+-C "$2"} ls-tree HEAD "$1" | awk '{print $3}'; }
          fail=0
          for path in $(git ls-tree --name-only HEAD dep/); do
            x=${path#dep/}
            own=$(pin "dep/$x")
            if [ "$x" != "$upper" ]; then
              theirs=$(pin "dep/$x" "dep/$upper")
              if [ -n "$theirs" ] && [ "$own" != "$theirs" ]; then
                echo "dep/$x is $own, $upper pins $theirs" >&2; fail=1
              fi
            fi
            gen=$(pin "gen/dep/$x")
            if [ "$gen" != "$own" ]; then
              echo "gen/dep/$x is ${gen:-missing}, dep/$x is $own" >&2; fail=1
            fi
          done
          exit $fail
      - if: strategy.job-index == 0
        run: mach fmt --check .
      - if: strategy.job-index == 0
        run: mach fmt --check gen
      - run: mach test . --all -t ${{ matrix.target }} --allow-unrunnable --timeout 10m
      - run: mach dep pull gen
      - run: mach test gen --all -t ${{ matrix.target }} --allow-unrunnable --timeout 10m

  gate:
    if: always()
    needs: [targets, test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
