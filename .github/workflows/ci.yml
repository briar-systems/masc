name: CI

# during the v7 transition every pull request builds masc and gen on one linux leg. the full
# gate, every target built and tested, comes back with the verification issue (#419).

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # bumped on purpose, in a PR of its own. mach's bootstrap chain at this commit names the seed
  # and the steps that build it
  MACH_REF: 1ea24dc103f548cd25a111849b508241d4408915

jobs:
  build:
    name: build (ubuntu-latest, linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # until a 7.x release exists, masc is built with the compiler of the MACH_REF commit of mach,
      # built by that commit's own bootstrap. the compiler is cached per runner os and arch and MACH_REF
      - id: mach
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/mach-src"
          git init --quiet "$src"
          git -C "$src" remote add origin https://github.com/briar-systems/mach
          git -C "$src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$src" checkout --quiet FETCH_HEAD
          (cd "$src" && bash .github/scripts/bootstrap.sh)
          built=$(sed -n 's/^MACH=//p' "$GITHUB_ENV" | tail -n 1)
          mkdir -p "$RUNNER_TEMP/mach"
          cp "$built" "$RUNNER_TEMP/mach/mach"
      - name: put mach on PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      # masc chooses only mink. every lower pin is mink's own, and gen pins what masc pins
      - name: pins agree with mink's
        run: |
          upper=mink
          pin() { git ${2:+-C "$2"} ls-tree HEAD "$1" | awk '{print $3}'; }
          fail=0
          for path in $(git ls-tree --name-only HEAD dep/); do
            x=${path#dep/}
            own=$(pin "dep/$x")
            if [ "$x" != "$upper" ]; then
              theirs=$(pin "dep/$x" "dep/$upper")
              if [ -n "$theirs" ] && [ "$own" != "$theirs" ]; then
                echo "dep/$x is $own, $upper pins $theirs" >&2; fail=1
              fi
            fi
            gen=$(pin "gen/dep/$x")
            if [ "$gen" != "$own" ]; then
              echo "gen/dep/$x is ${gen:-missing}, dep/$x is $own" >&2; fail=1
            fi
          done
          exit $fail
      - run: mach build . -a '*'
      - run: mach dep pull gen
      - run: mach build gen -a '*'

  gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
