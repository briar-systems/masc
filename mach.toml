[project]
id = "masc"
version = "0.1.0"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library. as the default, its entry is what a dependent's `use masc;` binds
[artifact.masc]
kind = "static"
default = true
entry = "lib/masc.mach"
out = "lib/masc"
targets = ["*"]
link = []
need = []

# the command line over the library
[artifact.cli]
kind = "bin"
entry = "bin/masc.mach"
out = "bin/masc{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# the table generators, which read only the vendored sources under src/gen/vendor
[artifact.gen]
kind = "bin"
entry = "bin/gen.mach"
out = "bin/gen{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

# the external agreement oracles, run locally and never in ci
[artifact.harness]
kind = "bin"
entry = "bin/harness.mach"
out = "bin/harness{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.5"
